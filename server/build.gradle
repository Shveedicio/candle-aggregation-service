plugins {
  id 'application'
  id 'org.springframework.boot'
//  id 'org.jetbrains.kotlin.plugin.jpa'
  id "org.jetbrains.kotlin.kapt"
  id 'com.google.protobuf'
}

dependencies {
  implementation(project(":${rootProject.name}-api"))

  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core")

  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-web'
//  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//  implementation 'org.springframework.boot:spring-boot-starter-quartz'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
  implementation 'org.springframework.boot:spring-boot-starter-aop'

  // WebSocket
  implementation 'org.eclipse.jetty.websocket:jetty-websocket-jetty-client:12.0.22'
  implementation 'org.eclipse.jetty:jetty-http:12.0.22'
  implementation 'org.eclipse.jetty:jetty-util:12.0.22'
  implementation 'org.eclipse.jetty:jetty-io:12.0.22'

  // Mapper & Converter
  implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
  kapt "org.mapstruct:mapstruct-processor"
  implementation 'org.mapstruct:mapstruct'
  implementation 'com.jayway.jsonpath:json-path'

  // Kafka & Protobuf
  implementation 'org.springframework.kafka:spring-kafka'
  implementation 'com.google.protobuf:protobuf-kotlin'
  implementation 'io.confluent:kafka-protobuf-serializer'

  // Persistence
//  implementation 'org.postgresql:postgresql'
//  implementation 'org.liquibase:liquibase-core'

  // Feign
  implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
  implementation 'io.github.openfeign:feign-httpclient'
  implementation 'io.github.openfeign:feign-micrometer'

  // Resilience4j
  implementation 'io.github.resilience4j:resilience4j-ratelimiter'

  // Logging
  implementation 'org.zalando:logbook-spring-boot-starter'
  implementation 'org.zalando:logbook-httpclient5'

  // Tracing & Metrics
  implementation 'io.micrometer:micrometer-tracing-bridge-brave'
  implementation 'io.micrometer:micrometer-registry-prometheus'

  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")

  // Cache
  implementation 'com.github.ben-manes.caffeine:caffeine'

  // JUnit-testing
  implementation 'junit:junit:4.13.1'
  implementation 'org.junit.jupiter:junit-jupiter:5.9.0'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.0'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'io.zonky.test:embedded-postgres'
  testImplementation("io.zonky.test:embedded-database-spring-test:2.6.0")

  testImplementation 'org.springframework.kafka:spring-kafka-test'

  // Mocking
  testImplementation 'org.mockito:mockito-junit-jupiter:4.8.0'
  testImplementation 'org.mockito:mockito-core:3.12.4'
  testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'
}

protobuf {
  protoc {
    artifact = "com.google.protobuf:protoc:$protobufVersion"
  }

  generateProtoTasks {
    all().forEach {
      it.builtins {
        create("kotlin")
      }
    }
  }
}

compileJava.dependsOn tasks.generateProto
compileTestJava.dependsOn tasks.generateProto

tasks {
  test {
    useJUnitPlatform()
  }
  processResources {
    copy {
      from("../docs/api/")
      into("src/main/resources/static/openapi")
    }
  }
}

springBoot {
  buildInfo()
}

jar {
  enabled = false
}

bootJar {
  enabled = true
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
