---
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/candle-aggregation-service
    username: candle-aggregation-service
    password: candle-aggregation-service

  liquibase:
    enabled: true
    user: candle-aggregation-service
    password: candle-aggregation-service

  kafka:
    bootstrap-servers: localhost:9092, localhost:9093
    producer:
      properties:
        schema.registry.url: http://localhost:8081
    consumer:
      properties:
        schema.registry.url: http://localhost:8081

springdoc:
  swagger-ui:
    enabled: true
